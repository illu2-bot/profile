<!DOCTYPE html>
<html>
<head>
  <title>MORE MORE JUMP!風プロフィール</title>

  <style>
    body {
      background: linear-gradient(to bottom right, #ffd6f5, #d6fff5);
      font-family: sans-serif;
      text-align: center;
      padding: 40px;
    }

    .card {
      background: white;
      width: 450px;
      margin: auto;
      padding: 30px;
      border-radius: 25px;
      box-shadow: 0 0 20px rgba(255, 105, 180, 0.4);
    }

    h1 {
      color: #ff69b4;
      font-size: 45px;
    }

    h2 {
      color: #00c3a3;
    }

    p {
      font-size: 18px;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      background: #fff0f8;
      margin: 12px;
      padding: 12px;
      border-radius: 15px;
      font-size: 18px;
    }

    a {
      text-decoration: none;
      color: white;
      background: #ff69b4;
      padding: 12px 25px;
      border-radius: 15px;
      display: inline-block;
      margin-top: 20px;
      font-size: 18px;
      transition: 0.3s;
    }

    a:hover {
      background: #ff8ac6;
      transform: scale(1.05);
    }

    .sparkle {
      font-size: 30px;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="sparkle">✨🎀✨</div>

    <h1>こんにちは！</h1>

    <p>私の名前はゆきなです！</p>

    <h2>好きなもの</h2>

    <ul>
      <li>🎮 プロセカ</li>
      <li>🎵 KPOP</li>
      <li>🍜 麻辣湯</li>
    </ul>

    <a href="https://x.com/mokamoka_night?s=21">
      Twitterを見る
    </a>

  </div>

</body>
</html>
